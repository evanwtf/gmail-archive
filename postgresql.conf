# A documented starting point, not a tuned configuration.
#
# This file REPLACES the server configuration entirely (compose starts postgres
# with -c config_file=/etc/postgresql/postgresql.conf), so anything absent here
# takes its built-in default rather than the initdb-generated value. Keep it
# self-contained.
#
# The deployment target is undecided — candidate hosts range from a 2-core i3 to
# a 12-core Ultra 5 — so nothing below is sized for a specific machine. Each
# setting says what to scale it against. Measure before changing any of them.

# Must be '*' for the app container to reach the server over the compose
# network. The server is not published to the host, so this does not widen
# exposure beyond the compose network itself.
listen_addresses = '*'
max_connections = 50                # scale against: worker count + web workers,
                                    # not against cores. Each ingest worker holds
                                    # at most one connection.

# --- memory ------------------------------------------------------------------
shared_buffers = 512MB              # scale against: RAM. ~25% of total is the
                                    # usual starting point. This value assumes a
                                    # host with at least 4 GB free.
work_mem = 32MB                     # scale against: RAM / max_connections, and
                                    # down if large sorts start swapping. Applies
                                    # PER sort/hash node, so a complex query can
                                    # use several multiples of it.
maintenance_work_mem = 512MB        # scale against: RAM. Governs index builds —
                                    # the GIN index over 300k-800k message bodies
                                    # is the reason this is not the 64MB default.
effective_cache_size = 2GB          # scale against: RAM the OS can use for page
                                    # cache. A planner hint only; allocates nothing.

# --- write path --------------------------------------------------------------
# The initial import is one enormous bulk load followed by a read-mostly life.
# These favour the import; docs/runbook.md will list what to revert afterwards.
wal_compression = zstd              # scale against: CPU headroom vs disk. Assumes
                                    # local disk (no network filesystem anywhere).
max_wal_size = 4GB                  # scale against: disk free and tolerable
                                    # recovery time. Larger means fewer
                                    # checkpoints during the import.
min_wal_size = 1GB
checkpoint_completion_target = 0.9
synchronous_commit = on             # Leave ON. The blob store's durability story
                                    # (fsync, atomic rename, then insert the row)
                                    # assumes a committed row means a durable row.

# --- planner -----------------------------------------------------------------
random_page_cost = 1.1              # scale against: storage type. 1.1 assumes
                                    # SSD/NVMe. Raise toward 4 on spinning rust.
effective_io_concurrency = 200      # scale against: storage queue depth. 200 is
                                    # an SSD figure; use 1-2 for a single HDD.

# --- logging -----------------------------------------------------------------
log_timezone = 'UTC'
log_min_duration_statement = 1000   # scale against: how noisy this gets. Logs
                                    # any statement over 1s, which during a bulk
                                    # import means the COPYs and little else.
log_checkpoints = on
log_autovacuum_min_duration = 0

# --- autovacuum --------------------------------------------------------------
autovacuum = on
autovacuum_vacuum_scale_factor = 0.05   # scale against: table churn. The archive
                                        # is append-mostly, so the aggressive
                                        # setting costs little and keeps the
                                        # visibility map fresh for index-only scans.
autovacuum_analyze_scale_factor = 0.02

datestyle = 'iso, mdy'
timezone = 'UTC'
default_text_search_config = 'pg_catalog.english'
